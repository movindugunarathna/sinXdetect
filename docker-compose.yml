# filepath: c:\Users\movin\FYP\sinXdetect\docker-compose.yml
# SinXdetect Base Docker Compose (Development - Local Testing)
#
# Usage:
#   docker compose up --build -d --remove-orphans
#   docker compose down --remove-orphans
#
# Development URLs (local):
#   - Application: http://localhost:3000
#   - API via nginx: http://localhost:3000/api/
#
# For production deployment, use: docker-compose.prod.yml
# For development with hot-reload, use: docker-compose.dev.yml

services:
  # Combined sinXdetect Application (Frontend + Backend)
  # Uses the unified multi-stage Dockerfile
  sinxdetect:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000/api
        - NODE_ENV=development
    container_name: sinxdetect-app
    ports:
      - '3000:80'
    volumes:
      - feedback-data:/app/data
    environment:
      - MODEL_PATH=/app/ml/models/sinbert_sinhala_classifier
      - FEEDBACK_DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - UVICORN_WORKERS=1
      - NODE_ENV=development
    networks:
      - sinxdetect-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:80/',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  feedback-data:

networks:
  sinxdetect-network:
    driver: bridge
